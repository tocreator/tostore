name: analyze

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pub get also resolves example/. That app depends on flutter_test,
      # so the job needs a Flutter SDK, not a standalone Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Smoke test
        run: dart test
